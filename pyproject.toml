[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aster-framework"
version = "0.1.0"
description = "Native PyTorch workflows for training, fine-tuning, inference, and evaluation"
readme = "README.md"
license-files = ["NOTICE.md", "docs/third_party/*.txt"]
requires-python = ">=3.11"
dependencies = ["torch>=2.6,<3", "numpy>=1.26"]
keywords = ["pytorch", "fine-tuning", "lora", "inference", "distributed-training"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = ["pytest>=8", "Pillow>=10", "safetensors>=0.4"]
dev = ["build>=1.2,<2", "twine>=6,<7", "ruff==0.16.5"]
oracle = ["transformers>=5,<6", "safetensors>=0.4"]
media = ["Pillow>=10"]
native-flash = ["triton>=3.4,<4; platform_system == 'Linux'"]
generative-eval = ["Pillow>=10", "clean-fid>=0.1.35,<0.2"]
language-eval = ["lm-eval==0.4.12"]
planning-oracle = ["mctx==0.0.71"]

[project.urls]
Repository = "https://github.com/sutiankang/aster"
Documentation = "https://github.com/sutiankang/aster/blob/main/docs/README.md"
Issues = "https://github.com/sutiankang/aster/issues"
Changelog = "https://github.com/sutiankang/aster/blob/main/CHANGELOG.md"

[project.scripts]
aster = "aster.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aster*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["oracle: optional official reference comparison", "distributed: real multi-process communication", "gpu: requires a separately provisioned GPU runtime", "benchmark: public benchmark protocol"]
